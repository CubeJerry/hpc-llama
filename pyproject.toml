[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-llm"
version = "0.2.0"
description = "Launch persistent Slurm/PBS browser chat sessions and create files in a selected workspace"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7", "aiohttp>=3.12,<4", "textual>=6,<9", "pydantic>=2.11,<3", "pypdf>=6,<7", "python-docx>=1.2,<2", "openpyxl>=3.1.5,<4", "pillow>=11,<13", "beautifulsoup4>=4.13,<5", "ddgs==9.16.0"]

[project.scripts]
hpc-llm = "hpc_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpc_llm = ["*.html", "*.js"]
